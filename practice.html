<h2>اليوم 1: أسواق سحاب: القيمة قبل النموذج</h2>
<ol>
<li><p>سلسلة مكتبات تشتري نظامًا يقترح كمية إعادة الطلب لكل كتاب كل أسبوع، ويقرأ المشرف الاقتراح ثم يطلب. يقول المورد: «دقة النظام 94% على بيانات العام الماضي». بأي نتيجة تحكم على قيمته؟</p><ul><li><b>أ.</b> الدقة 94%، فهي أعلى من الحد المقبول في القطاع ومن عروض المنافسين</li><li><b>ب.</b> تكلفة الكتب الراكدة والرفوف الفارغة أمام طريقة الطلب الحالية</li><li><b>ج.</b> عدد الاقتراحات التي قبلها المشرفون دون تعديل</li><li><b>د.</b> الفرق بين النظام وطلب عشوائي على بيانات العام الماضي نفسها</li></ul></li>
<li><p>سلسلة صيدليات تقيّم تنبؤًا أسبوعيًّا لواقي الشمس. المورد درّب النموذج على 2024. أي مقارنة تكفي لتقول إن النموذج أدق من الطريقة الحالية؟</p><ul><li><b>أ.</b> خطأ النموذج على 2024 أمام خطأ الموسمي البسيط على 2024، بالنسبة الموزونة والانحياز</li><li><b>ب.</b> خطأ النموذج على 2025 أمام طلب عشوائي على 2025</li><li><b>ج.</b> خطأ النموذج والموسمي البسيط على 2025، بالنسبة الموزونة والانحياز</li><li><b>د.</b> متوسط نسبة الخطأ لكل أسبوع في 2025، للنموذج وحده</li></ul></li>
<li><p>متجر إلكترونيات يقيّم تنبؤًا بترخيص 100,000 ريال لكل فئة. في الشواحن: الخطأ ينقص من 20% إلى 8%، والوفر 60,000 ريال. في الشاشات: الخطأ ينقص من 12% إلى 9%، والوفر 250,000 ريال. ماذا توصي؟</p><ul><li><b>أ.</b> الشواحن وحدها، لأن الخطأ فيها نقص أكثر</li><li><b>ب.</b> الفئتان، لأن النموذج أدق في كل منهما</li><li><b>ج.</b> لا شيء، لأن الوفر في الفئتين معًا لا يكفي لترخيص الحزمة كاملة</li><li><b>د.</b> الشاشات وحدها، لأن وفرها يزيد على الترخيص</li></ul></li>
<li><p>محل حلويات نفدت فيه علب المعمول في الأسبوع الأخير قبل العيد: باع 300 علبة، وقدّر المشرف أن 450 طُلبت. تقارن الآن تنبؤين على هذا العام. ماذا تفعل بذلك الأسبوع؟</p><ul><li><b>أ.</b> تحسب الخطأ عليه كأي أسبوع، فالمبيعات هي الحقيقة</li><li><b>ب.</b> تستبعده من القياس، وتسجّل الطلب التقديري للعام القادم</li><li><b>ج.</b> تضع مكانه متوسط مبيعات الأسابيع الأخرى</li><li><b>د.</b> تعده خطأً كبيرًا على التنبؤ الذي اقترح الكمية، فهو سبب النفاد</li></ul></li>
<li><p>تطبيق لبيع الكتب يقول مورد توصياته: «معدل الإصابة 8%، أي 16 ضعف التوصية العشوائية». قائمة الأكثر مبيعًا تصيب 7.3%. للعملاء العائدين 11% مقابل 7%، وللجدد 2% مقابل 8%. ما الخلاصة؟</p><ul><li><b>أ.</b> النظام يضيف قيمة للعائدين فقط، وللجدد قائمة الأكثر مبيعًا أفضل</li><li><b>ب.</b> النظام ناجح، فهو 16 ضعف العشوائي</li><li><b>ج.</b> النظام لا يضيف شيئًا، فالفرق 0.7 نقطة فقط</li><li><b>د.</b> النظام يرفع المبيعات بنحو 10% فوق قائمة الأكثر مبيعًا، بحسب فرق الإصابة</li></ul></li>
<li><p>تطبيق توصيل طعام جرّب ترتيبًا جديدًا للمطاعم أربعة أسابيع. مقياس القرار المكتوب مسبقًا: الإيراد لكل زائر. النتيجة: الطلبات ارتفعت 5% في الأسبوع الأول و1% في الأخير، والإيراد لكل زائر لم يتغير، والزوار 20,040 في النسخة الحالية و19,960 في الجديدة. ماذا تقرر؟</p><ul><li><b>أ.</b> التعميم، فالطلبات ارتفعت 5%</li><li><b>ب.</b> إعادة التجربة، لأن الزوار لم ينقسموا نصفين تمامًا</li><li><b>ج.</b> عدم التعميم: مقياس القرار ثابت والارتفاع تلاشى</li><li><b>د.</b> التعميم، لأن الطلبات في الأسابيع الأربعة معًا أعلى</li></ul></li>
<li><p>تطبيق صيدلية فيه موافقتان: «استلام العروض» و«استعمال الموقع». يريد الفريق أن يحسب لكل عميل خصمًا من سجل مشترياته ويرسله في رسالة. 80% وافقوا على العروض، و30% على الموقع. لمن يجوز الخصم المحسوب من السجل؟</p><ul><li><b>أ.</b> لمن وافق على استلام العروض، أي 80%، فالخصم عرض تسويقي</li><li><b>ب.</b> لمن وافق على الموقع، أي 30%</li><li><b>ج.</b> للجميع، فسجل المشتريات عند الصيدلية أصلًا</li><li><b>د.</b> لا أحد بعد: يحتاج موافقة على غرض التخصيص نفسه</li></ul></li>
<li><p>نادٍ رياضي يحسب خصم التجديد من ثلاثة مكونات: الحضور، والقرب من نادٍ منافس، ومدة الاشتراك. متوسط الخصم لمن هم فوق 55 عامًا 3%، ولغيرهم 7%. مكوّن المدة ناقص 3 للأولى وناقص 0.5 للثانية، والمكونان الآخران متقاربان. ماذا تكتب في المذكرة؟</p><ul><li><b>أ.</b> لا تمييز، فالقاعدة لا تقرأ العمر</li><li><b>ب.</b> حذف مكوّن المدة أو سقفه، ثم قياس الفرق</li><li><b>ج.</b> يضاف للأكبر سنًّا خصم ثابت يعوض الفرق</li><li><b>د.</b> الفرق 4 نقاط، فيُطلب من المورد مراجعة النموذج وإعادة تدريبه على بيانات أحدث</li></ul></li>
<li><p>سلسلة مطاعم تشتري نظامًا يتنبأ بعدد الزوار لكل فرع كل يوم، ويقرأ مدير الفرع الرقم ثم يحدد عدد الموظفين في المناوبة. أين تُقاس قيمة النظام؟</p><ul><li><b>أ.</b> في دقة التنبؤ بعدد الزوار على بيانات العام الماضي كله</li><li><b>ب.</b> في عدد المرات التي اتبع فيها المديرون الرقم</li><li><b>ج.</b> في تكلفة التوظيف والانتظار أمام الجدولة الحالية</li><li><b>د.</b> في الفرق بين النظام وتوظيف عدد ثابت لا يتغير</li></ul></li>
<li><p>أي هذه الأوصاف يجعل النظام يتخذ القرار دون إنسان في كل مرة؟</p><ul><li><b>أ.</b> يرتب النظام نتائج البحث، وتظهر للعميل كما هي</li><li><b>ب.</b> يقترح النظام نسبة التخفيض ويوافق مدير الفرع أو يعدّل</li><li><b>ج.</b> يرسل النظام تنبيهًا يفحصه مهندس قبل أي إجراء</li><li><b>د.</b> يعطي النظام كل عميل درجة يقرؤها فريق المبيعات</li></ul></li>
<li><p>مورد تنبؤ يعرض خطأ 3% محسوبًا على بيانات 2025، وهي السنة التي درّب عليها نموذجه. ماذا تطلب قبل المقارنة؟</p><ul><li><b>أ.</b> الخطأ نفسه محسوبًا بمتوسط النسب بدل النسبة الموزونة</li><li><b>ب.</b> الخطأ على عينة عشوائية من صفوف 2025</li><li><b>ج.</b> الخطأ على فترة لاحقة لم يرها، أمام الموسمي البسيط</li><li><b>د.</b> شهادة من عميل آخر استعمل النظام</li></ul></li>
<li><p>تنبؤ يخفض الخطأ في الأدوات المكتبية من 18% إلى 9% ووفره 40,000 ريال، وفي القرطاسية المدرسية من 15% إلى 12% ووفره 300,000 ريال. الترخيص 120,000 ريال لكل فئة. ماذا توصي؟</p><ul><li><b>أ.</b> القرطاسية المدرسية وحدها</li><li><b>ب.</b> الأدوات المكتبية، لأن الخطأ فيها نقص إلى النصف</li><li><b>ج.</b> الفئتين، لأن التنبؤ أدق فيهما</li><li><b>د.</b> لا شيء، لأن متوسط التحسن أقل من 30%</li></ul></li>
<li><p>صح أم خطأ: المبيعات في أسبوع نفد فيه المنتج من الرف تصلح لقياس خطأ التنبؤ مثل أي أسبوع آخر.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>متجر حلويات يستعمل قاعدة «مثل الأسبوع نفسه من العام الماضي». في أي أسبوع تتوقع أكبر خطأ لها؟</p><ul><li><b>أ.</b> أسبوع عادي في منتصف الصيف</li><li><b>ب.</b> الأسبوع الأول من السنة الميلادية</li><li><b>ج.</b> أسبوع لم يتغير فيه السعر</li><li><b>د.</b> الأسبوع الذي يسبق عيد الفطر</li></ul></li>
<li><p>تجربة A/B لصفحة منتج: معدل التحويل ارتفع، والإيراد لكل زائر لم يتغير، ومقياس القرار المكتوب مسبقًا هو الإيراد لكل زائر. ما الخلاصة؟</p><ul><li><b>أ.</b> لا تعميم، فمقياس القرار لم يتغير</li><li><b>ب.</b> التغيير ناجح، فالتحويل ارتفع</li><li><b>ج.</b> يجب إعادة التجربة بمقياس آخر</li><li><b>د.</b> التغيير ناجح إذا كانت النتيجة دالة إحصائيًّا</li></ul></li>
<li><p>تطبيق متجر فيه موافقة واحدة: «استلام العروض». يريد الفريق حساب سعر شخصي لكل عميل من سجل مشترياته. ما الوضع؟</p><ul><li><b>أ.</b> مسموح لمن وافق على العروض</li><li><b>ب.</b> مسموح للجميع لأن السجل عند المتجر</li><li><b>ج.</b> مسموح إذا لم يُذكر اسم العميل في القاعدة</li><li><b>د.</b> يحتاج موافقة على غرض التخصيص</li></ul></li>
<li><p>قاعدة خصم لا تقرأ العمر. متوسط الخصم لمن فوق 60 عامًا 2% ولغيرهم 5%، ومكوّن «مدة العضوية» يصنع أغلب الفرق. ما التعديل الأنسب؟</p><ul><li><b>أ.</b> لا تعديل، فالعمر ليس في القاعدة</li><li><b>ب.</b> حذف مكوّن المدة أو سقفه، وقياس الفرق</li><li><b>ج.</b> إضافة خصم ثابت لمن فوق 60 عامًا</li><li><b>د.</b> نشر القاعدة للعملاء ليعرفوا سبب الفرق</li></ul></li>
<li><p>صح أم خطأ: استنتاج حالة صحية من مشتريات العميل لتوجيه عروض له معالجة لبيانات حساسة.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>أي جملة تصلح «تعديلًا مقترحًا» في مذكرة نتائج عن فروق الأسعار؟</p><ul><li><b>أ.</b> سنراجع القاعدة مع المورد في الربع القادم</li><li><b>ب.</b> نلتزم بالإنصاف في كل قرارات التسعير</li><li><b>ج.</b> نحذف مكوّن طريقة الدفع ونقيس الفرق شهريًّا</li><li><b>د.</b> ندرّب النموذج على بيانات أكثر</li></ul></li>
</ol>
</section>
<section>
<h2>اليوم 2: سحاب للاتصالات: الاحتفاظ والشبكة والخريطة</h2>
<ol>
<li><p>مخبز يدرس نموذجًا للتنبؤ بالطلب ترخيصه 60,000 ريال لكل فئة في السنة. على سنة لم يرها النموذج، يقلل الهدر والنقص أمام «مبيعات الأسبوع نفسه من العام الماضي» بما قيمته 150,000 ريال في الخبز، و40,000 في الحلويات، و90,000 في المعجنات. ماذا يوصي المحلل؟</p><ul><li><b>أ.</b> الترخيص للفئات الثلاث، فالوفر الكلي 280,000 ريال أكبر من الترخيص 180,000</li><li><b>ب.</b> لا ترخيص، فالنموذج لا يربح في كل الفئات</li><li><b>ج.</b> الترخيص للخبز والمعجنات فقط، وتبقى الحلويات على القاعدة البسيطة</li><li><b>د.</b> نطلب من المورد دقة النموذج في كل فئة قبل أي قرار</li></ul></li>
<li><p>شركة تأمين تتصل هاتفيًّا قبل التجديد. في تجربة بالقرعة، المجموعتان متشابهتان في العمر ومدة الوثيقة. عدم التجديد 22% دون اتصال و18% مع الاتصال. في أعلى شريحة خطر: 45% دون اتصال و44% معه. ما الخلاصة؟</p><ul><li><b>أ.</b> الاتصال يخفض عدم التجديد 4 نقاط، ولا يكاد يغيّر أعلى شريحة خطر</li><li><b>ب.</b> الاتصال يفشل في أعلى شريحة لأن 44% ما زالوا لا يجددون</li><li><b>ج.</b> لا تُقرأ النتيجة لأن المجموعتين قد تختلفان</li><li><b>د.</b> تُركّز الاتصالات على أعلى شريحة خطر، فهي الأكثر مغادرة</li></ul></li>
<li><p>شركة كهرباء تجرب عرض خصم لمن يُتوقع أن ينتقلوا إلى مزوّد آخر. في خلية «فواتير مرتفعة، عقد منتهٍ» الانتقال 40% دون عرض و39% معه. في «فواتير متوسطة، عقد منتهٍ» 18% و11%. في «فواتير منخفضة، عقد سارٍ» 3% و5%. أي خلية ترسل لها العرض؟</p><ul><li><b>أ.</b> «فواتير مرتفعة، عقد منتهٍ»، لأن نسبة الانتقال فيها أعلى</li><li><b>ب.</b> «فواتير منخفضة، عقد سارٍ»، لأن الانتقال فيها أقل</li><li><b>ج.</b> الخلايا الثلاث، فالعرض لا يكلف كثيرًا</li><li><b>د.</b> «فواتير متوسطة، عقد منتهٍ» وحدها، فالأثر فيها 7 نقاط والعرض يغيّر قرارهم</li></ul></li>
<li><p>شركة إنترنت منزلي تقارن سياستين لعرض بـ30 ريالًا. «الأعلى خطرًا»: 50,000 عرض، 200 محتفظ بهم، الصافي سالب. «بالأثر الإضافي»: 80,000 عرض، 3,000 محتفظ بهم، الصافي موجب، و96% من عروضها مهدرة. ماذا يقول المحلل؟</p><ul><li><b>أ.</b> لا هذه ولا تلك، فـ96% من العروض مهدرة، وهي نسبة لا تقبلها أي إدارة</li><li><b>ب.</b> سياسة الأثر الإضافي، مع افتراضات التكبير بجانب الرقم</li><li><b>ج.</b> «الأعلى خطرًا»، لأنها ترسل عروضًا أقل</li><li><b>د.</b> الاثنتان معًا، لتصل العروض إلى الكل</li></ul></li>
<li><p>منصة تعليمية ترسل تذكيرًا لمن يُتوقع أن يتركوا الدورة. قبل تحديث النموذج: الإكمال 70% مع التذكير و64% في مجموعة الضبط. بعد تحديثه على نتائج الحملة: 80% مع التذكير و79% في الضبط. ماذا حدث؟</p><ul><li><b>أ.</b> التحديث نجح، فالإكمال مع التذكير ارتفع 10 نقاط بعد إعادة التدريب</li><li><b>ب.</b> التذكير صار أضعف ويجب تغيير نصه</li><li><b>ج.</b> النموذج الجديد يختار من يكمل على كل حال، فهبط الأثر</li><li><b>د.</b> مجموعة الضبط لم تعد صالحة، فلا نستطيع القول</li></ul></li>
<li><p>مورد لنظام مراقبة مصاعد في 300 مبنى يقول: «دقة إجمالية 99%». في أسبوع: 840 تنبيهًا، 42 منها يقابلها عطل مؤكد. وكان في الأسبوع 50 عطلًا مؤكدًا، كُشف منها 42. ماذا يكتب المحلل؟</p><ul><li><b>أ.</b> النظام ممتاز، والنشرة تؤكد ذلك</li><li><b>ب.</b> الدقة 5% والاستدعاء 84%</li><li><b>ج.</b> الدقة 84%، أي 42 من 50 عطلًا، وهي قريبة مما قاله المورد</li><li><b>د.</b> النظام يكشف أغلب الأعطال، فلا مشكلة</li></ul></li>
<li><p>فريق مراقبة جودة في مصنع يفحص 50 تنبيهًا في اليوم على الأكثر، ولا يُقبل أن يفوت أكثر من عيب خطير واحد في الأسبوع. عند 0.5: 90 تنبيهًا وعيب خطير فائت. عند 0.6: 45 تنبيهًا وعيب خطير فائت. عند 0.7: 20 تنبيهًا وثلاثة عيوب خطيرة فائتة. أيها تختار؟</p><ul><li><b>أ.</b> 0.5، لأنها تفوّت أقل عدد من العيوب</li><li><b>ب.</b> 0.7، لأن دقتها أعلى وتنبيهاتها الأقل بين العتبات الثلاث</li><li><b>ج.</b> لا عتبة، حتى يُشترى نموذج أفضل</li><li><b>د.</b> 0.6، فهي ضمن الطاقة وتحقق شرط العيوب الخطيرة، وثمنها يُكتب</li></ul></li>
<li><p>شركة نقل ذكي في مجموعة تضم سلسلة مطاعم. السلسلة تطلب أرقام جوالات من رُكّاب نُقلوا إلى مطاعم منافسة الشهر الماضي، لترسل لهم عروضًا. بيانات الرحلات جُمعت لتقديم خدمة النقل، ولا موافقة من الركاب على تسويق جهة أخرى. ما القرار؟</p><ul><li><b>أ.</b> رفض القائمة، واقتراح أعداد رحلات مجمّعة بلا معرّفات</li><li><b>ب.</b> الموافقة، فالشركتان في مجموعة واحدة والبيانات داخل المجموعة أصلًا</li><li><b>ج.</b> الموافقة بعد حذف أسماء الركاب والإبقاء على الأرقام</li><li><b>د.</b> تسليم القائمة الآن، ثم سؤال الركاب عن الموافقة بعد أول عرض</li></ul></li>
<li><p>سلسلة صيدليات تدرس نظامًا يرسل عروضًا بحسب مشتريات الأدوية. المورد يدّعي 4 ملايين ريال في السنة دون قياس. الضرر منخفض، والعملاء لم يوافقوا على استعمال مشترياتهم الدوائية للتسويق. بالدليل المعروض، أين تقع؟</p><ul><li><b>أ.</b> امضِ، فالقيمة 5 والضرر منخفض</li><li><b>ب.</b> اختبر بتكلفة قليلة، فالقيمة 2 بعد سقف ادعاء المورد</li><li><b>ج.</b> توقّف: بيانات صحية تُستعمل للتسويق</li><li><b>د.</b> أصلح أولًا، ثم أعد التقدير</li></ul></li>
<li><p>تقرير يقول إن نظام عروض «أنقذ» 12,000 عميل في شهر، محسوبين بكل من تلقى العرض وبقي. ما الذي يجعل الرقم مقبولًا؟</p><ul><li><b>أ.</b> أن يكون النظام قد اختار العملاء الأعلى خطرًا</li><li><b>ب.</b> أن تكون نسبة البقاء بين من تلقوا العرض فوق 90%</li><li><b>ج.</b> أن يكون العرض قد أرسل لعدد كبير من العملاء</li><li><b>د.</b> أن يُطرح منه من كانوا سيبقون، بمجموعة ضبط</li></ul></li>
<li><p>مشغل اتصالات يجرب إطفاء حزم تردد ليلًا في 50 موقعًا. انخفضت الطاقة فيها 12% بين شهر وشهر، وانخفضت 5% في 50 موقعًا لم يتغير فيها شيء في الشهرين نفسيهما. كم توفر الميزة تقريبًا؟</p><ul><li><b>أ.</b> نحو 12%</li><li><b>ب.</b> نحو 7%</li><li><b>ج.</b> نحو 17%</li><li><b>د.</b> لا يمكن معرفته دون تجربة أطول</li></ul></li>
<li><p>في تجربة عشوائية، نسبة انصراف أعلى شريحة خطر 40% دون عرض و39% مع العرض، وفي الشريحة الوسطى 15% دون عرض و8% مع العرض. أين ترسل العروض؟</p><ul><li><b>أ.</b> للشريحة العليا، لأن انصرافها الأعلى</li><li><b>ب.</b> للشريحة الوسطى، لأن العرض يخفض انصرافها 7 نقاط</li><li><b>ج.</b> للشريحتين، لأن العرض يخفض الانصراف في كل منهما</li><li><b>د.</b> لا لأحد، لأن نسبة الانصراف مع العرض ما زالت مرتفعة</li></ul></li>
<li><p>صح أم خطأ: في بعض الخلايا قد يرفع عرض الاحتفاظ نسبة الانصراف، فيُستبعد أصحابها من العروض.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>خلية فيها 10,000 عميل، الأثر الإضافي للعرض فيها 2 نقطة، والعرض يكلف 60 ريالًا، وقيمة العميل المحتفظ به 1,500 ريال. هل العرض فيها رابح؟</p><ul><li><b>أ.</b> نعم، لأن 200 عميل يبقون بسبب العرض</li><li><b>ب.</b> نعم، لأن قيمة العميل أكبر من تكلفة العرض بكثير</li><li><b>ج.</b> لا: قيمة 300,000 ريال أمام تكلفة 600,000</li><li><b>د.</b> لا يمكن الحكم دون معرفة نسبة الانصراف في الخلية</li></ul></li>
<li><p>في أسبوع: 50 حادثة مؤكدة، و400 تنبيه فوق العتبة، منها 120 تقابل حوادث، والتنبيهات كشفت 40 حادثة. ما الدقة والاستدعاء؟</p><ul><li><b>أ.</b> الدقة 30% والاستدعاء 80%</li><li><b>ب.</b> الدقة 80% والاستدعاء 30%</li><li><b>ج.</b> الدقة 30% والاستدعاء 33%</li><li><b>د.</b> الدقة 10% والاستدعاء 80%</li></ul></li>
<li><p>فريق يفحص 100 تنبيه في اليوم على الأكثر. عند العتبة 0.4: 150 تنبيهًا في اليوم واستدعاء 95%. عند 0.5: 90 تنبيهًا واستدعاء 88%. عند 0.6: 40 تنبيهًا واستدعاء 70%. أي عتبة تختار؟</p><ul><li><b>أ.</b> 0.4، لأن استدعاءها الأعلى</li><li><b>ب.</b> 0.6، لأن تنبيهاتها أقل وأدق</li><li><b>ج.</b> أي منها، فالفرق في الاستدعاء صغير</li><li><b>د.</b> 0.5، أعلى استدعاء ضمن الطاقة</li></ul></li>
<li><p>صح أم خطأ: «دقة إجمالية 97%» محسوبة على كل ساعات كل المواقع تعني أن الكاشف يكشف أغلب الحوادث.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>ثلث تنبيهات الكاشف يقع أثناء أعمال صيانة مجدولة معروفة مسبقًا. ما أرخص تحسين؟</p><ul><li><b>أ.</b> نموذج جديد أدق من المورد</li><li><b>ب.</b> إخفاء تنبيهات نوافذ الصيانة</li><li><b>ج.</b> رفع العتبة حتى يقل العدد الثلث</li><li><b>د.</b> زيادة عدد المهندسين في كل مناوبة</li></ul></li>
<li><p>حالة استخدام قيمتها بحسب عرض المورد 3 ملايين ريال، ولم تُقس في الجهة. في دليل يضع سقفًا 2 لادعاء المورد، ما درجة قيمتها؟</p><ul><li><b>أ.</b> 5، لأن القيمة فوق مليوني ريال</li><li><b>ب.</b> 4، متوسط بين الادعاء والسقف</li><li><b>ج.</b> 2، أي سقف الدليل</li><li><b>د.</b> 1، لأنها لم تُقس</li></ul></li>
<li><p>حالة قيمتها مقيسة بتجربة عشوائية (درجة 5)، والضرر منخفض، لكنها تستعمل بيانات صحية دون موافقة صريحة (الحقوق 1). أين تضعها؟</p><ul><li><b>أ.</b> توقّف حتى يُصلح أساس البيانات</li><li><b>ب.</b> امضِ، لأن قيمتها الأعلى</li><li><b>ج.</b> اختبر بتكلفة قليلة</li><li><b>د.</b> أصلح أولًا، ثم امضِ دون تغيير البيانات</li></ul></li>
<li><p>حالتان متساويتان في المجموع، فيرتبهما الدليل بالرمز فقط. الأولى قيمتها من اختبار على الماضي، والثانية من تجربة عشوائية. بأيهما تفتتح المناقشة؟</p><ul><li><b>أ.</b> الأولى، لأن الاختبار على الماضي أسرع</li><li><b>ب.</b> أيهما، فالمجموع متساوٍ</li><li><b>ج.</b> الأولى، لأن قيمتها أكبر بالريال</li><li><b>د.</b> الثانية، لأن دليلها أقوى</li></ul></li>
<li><p>فرع تجزئة في مجموعة يطلب من شركة الاتصالات الشقيقة قائمة بأرقام المشتركين الذين زاروا متاجر منافسة ليرسل لهم عروضًا. ما البديل الذي يخدم الغرض التجاري ويحترم الحقوق؟</p><ul><li><b>أ.</b> القائمة نفسها بعد حذف الأسماء وإبقاء الأرقام</li><li><b>ب.</b> أعداد زوار مجمّعة بحسب الحي، دون أرقام</li><li><b>ج.</b> القائمة لمن وافق على تسويق شركة الاتصالات</li><li><b>د.</b> رفض الطلب دون بديل</li></ul></li>
</ol>
